name: AURA Cricket Newsroom

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context (optional)
        required: true
        type: string
        default: '{}'
  schedule:
    # GitHub scheduled workflows run from the default branch only.
    - cron: '17 */6 * * *'

concurrency:
  group: aura-cricket-newsroom
  cancel-in-progress: false

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: newsroom
    permissions:
      contents: write
    steps:
      - name: Check out the active website content branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/i18n-en-hi
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Collect cricket news and prepare bilingual review draft
        env:
          GEMINI_API_KEY: ${{ secrets.NEWSROOM_GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node scripts/newsroom/collect-and-draft.js
      - name: Commit review draft to the current branch
        run: |
          git add content/articles
          if git diff --cached --quiet -- content/articles; then
            echo "No new review draft to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git commit -m "content(newsroom): add AI-assisted cricket draft"
          git push origin HEAD:feature/i18n-en-hi
