name: AURA Cricket Newsroom

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context (optional)
        required: true
        type: string
        default: '{}'
  schedule:
    # GitHub scheduled workflows run from the default branch only.
    - cron: '17 */6 * * *'

concurrency:
  group: aura-cricket-newsroom
  cancel-in-progress: false

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: newsroom
    permissions:
      contents: read
    outputs:
      has_draft: ${{ steps.detect.outputs.has_draft }}
    steps:
      - name: Check out the active website content branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/i18n-en-hi
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.1.0
        with:
          node-version: 22
      - name: Collect cricket news and prepare bilingual review draft
        env:
          GEMINI_API_KEY: ${{ secrets.NEWSROOM_GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node scripts/newsroom/collect-and-draft.js
      - name: Isolate the newly generated draft
        id: detect
        shell: bash
        run: |
          mapfile -t files < <(git ls-files --others --exclude-standard content/articles)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_draft=false" >> "$GITHUB_OUTPUT"
            echo "No new review draft was generated."
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one new article JSON; found ${#files[@]}."
            exit 1
          fi
          file="${files[0]}"
          if [[ ! "$file" =~ ^content/articles/[a-z0-9-]+\.json$ ]]; then
            echo "Generated file path is not an allowed article JSON."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/newsroom-draft"
          cp -- "$file" "$RUNNER_TEMP/newsroom-draft/draft.json"
          echo "has_draft=true" >> "$GITHUB_OUTPUT"
      - name: Upload isolated review draft
        if: steps.detect.outputs.has_draft == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newsroom-review-draft
          path: ${{ runner.temp }}/newsroom-draft/draft.json
          if-no-files-found: error
          retention-days: 1

  commit-review-draft:
    needs: collect-and-draft
    if: needs.collect-and-draft.outputs.has_draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the content branch without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/i18n-en-hi
          persist-credentials: false
      - name: Download isolated review draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4.3.0
        with:
          name: newsroom-review-draft
          path: ${{ runner.temp }}/newsroom-draft
      - name: Validate and commit review draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_DIR: ${{ runner.temp }}/newsroom-draft
        shell: bash
        run: |
          mapfile -t files < <(find "$DRAFT_DIR" -maxdepth 1 -type f -name 'draft.json' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one isolated draft artifact."
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync, renameSync } from "node:fs";
            import path from "node:path";
            const source = process.env.DRAFT_DIR + "/draft.json";
            const article = JSON.parse(readFileSync(source, "utf8"));
            if (article.status !== "review" || Object.hasOwn(article, "publishedAt")) {
              throw new Error("Draft must remain review-only and must not have publishedAt.");
            }
            if (typeof article.slug !== "string" || !/^[a-z0-9-]{1,100}$/.test(article.slug)) {
              throw new Error("Draft slug is invalid.");
            }
            for (const field of ["title", "titleHi", "excerpt", "excerptHi", "body", "bodyHi"]) {
              if (typeof article[field] !== "string" || !article[field].trim()) {
                throw new Error("Draft is missing required bilingual field: " + field);
              }
            }
            if (!Array.isArray(article.sources) || article.sources.length !== 1 ||
                typeof article.sources[0]?.url !== "string" ||
                !/^https:\/\//i.test(article.sources[0].url)) {
              throw new Error("Draft must contain exactly one HTTPS source reference.");
            }
            const destination = path.resolve("content/articles", article.slug + ".json");
            renameSync(source, destination);
          '
          git add -- content/articles/*.json
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [[ ! "${staged[0]}" =~ ^content/articles/[a-z0-9-]+\.json$ ]]; then
            echo "Refusing to commit anything except one new article JSON."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(newsroom): add AI-assisted cricket draft"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:feature/i18n-en-hi
