name: Gemini API Model Access Check

on:
  push:
    branches:
      - feature/i18n-en-hi
    paths:
      - .github/workflows/gemini-model-access-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: newsroom
    steps:
      - name: Check Gemini API model access without generating content
        env:
          GEMINI_API_KEY: ${{ secrets.NEWSROOM_GEMINI_API_KEY }}
        shell: bash
        run: |
          set +x
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::NEWSROOM_GEMINI_API_KEY is unavailable in the newsroom environment."
            exit 1
          fi

          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/gemini-models.json" \
            --write-out "%{http_code}" \
            --header "x-goog-api-key: ${GEMINI_API_KEY}" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000")"

          echo "Gemini Models API HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/gemini-models.json", "utf8"));
              console.log(JSON.stringify(data.error ? {
                code: data.error.code,
                status: data.error.status,
                message: data.error.message
              } : { message: "Gemini API returned a non-200 response." }, null, 2));
            '
            exit 1
          fi

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const payload = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/gemini-models.json", "utf8"));
            const models = (payload.models || []).filter((m) =>
              /gemini/i.test(m.name || "") &&
              (m.supportedGenerationMethods || []).includes("generateContent")
            );
            const relevant = models.filter((m) =>
              /image|flash|pro/i.test(m.name || "") ||
              /image/i.test(m.description || "")
            ).map((m) => ({
              name: m.name,
              displayName: m.displayName,
              supportedGenerationMethods: m.supportedGenerationMethods
            }));
            console.log("Gemini models available to this API key that support generateContent:");
            console.log(JSON.stringify(relevant, null, 2));
            const imageModels = relevant.filter((m) => /image/i.test(m.name || ""));
            console.log("\nImage-model entries returned by Models API: " + imageModels.length);
            console.log("This check only lists model metadata. It does not generate an image or incur image-generation charges.");
          '
