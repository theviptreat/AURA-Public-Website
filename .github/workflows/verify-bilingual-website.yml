name: Verify bilingual website

on:
  workflow_dispatch:
  push:
    branches:
      - feature/i18n-en-hi
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48 # v4.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check newsroom script syntax
        run: node --check scripts/newsroom/collect-and-draft.js
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
