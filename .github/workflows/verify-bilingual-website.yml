name: Verify bilingual website

on:
  push:
    branches:
      - feature/i18n-en-hi
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check newsroom script syntax
        run: node --check scripts/newsroom/collect-and-draft.js
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
