name: Verify bilingual website

on:
  workflow_dispatch:
  push:
    branches:
      - feature/i18n-en-hi
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
